<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1>SI Content &amp; Commerce Agent</h1>
  <div id="status" aria-live="polite">Loading…</div>
  <div class="row">
    <button id="sync-feeds" type="button">Sync feeds</button>
    <button id="sync-prices" type="button">Sync prices</button>
    <button id="audit-tab" type="button">Audit this tab</button>
  </div>
  <div class="row">
    <input id="sku" placeholder="product SKU" aria-label="Product SKU">
    <button id="research" type="button">Research</button>
  </div>
  <label for="text">Text to clean</label>
  <textarea id="text" rows="4" placeholder="Paste text you own"></textarea>
  <button id="clean" type="button">Clean hidden characters</button>
  <button id="analyze-ads" type="button">Analyze ads CSV</button>
  <pre id="output" aria-live="polite"></pre>
  <button id="options" type="button">Settings</button>
</body>
</html>
