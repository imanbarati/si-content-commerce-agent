<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent settings</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="options.js"></script>
<link rel="stylesheet" href="popup.css"></head>
<body class="wide">
  <h1>Agent settings</h1>
  <p>Values are stored in this browser's local extension storage. Nothing is bundled or sent anywhere except the endpoints you configure.</p>
  <label>RSS feeds (one per line)<textarea id="feeds" rows="3"></textarea></label>
  <label>Products (sku|name|query|cost, one per line)<textarea id="products" rows="4"></textarea></label>
  <label>Research source<select id="researchProvider">
    <option value="google_news">Google News RSS (no key)</option>
    <option value="google_cse">Google Custom Search API</option>
    <option value="deepseek">DeepSeek Search</option>
    <option value="mcp">Configured MCP endpoint</option>
  </select></label>
  <label>Google CSE key<input id="googleCseKey" type="text"></label>
  <label>Google CSE CX<input id="googleCseCx" type="text"></label>
  <label>DeepSeek endpoint<input id="deepseekEndpoint" type="url"></label>
  <label>DeepSeek key<input id="deepseekKey" type="password" placeholder="stored locally"></label>
  <label>MCP Digikala URL<input id="mcpDigikalaUrl" type="url"></label>
  <label>MCP Torob URL<input id="mcpTorobUrl" type="url"></label>
  <label>SI chat endpoint<input id="aiEndpoint" type="url"></label>
  <label>SI key<input id="aiKey" type="password" placeholder="stored locally"></label>
  <div class="row"><label>Undercut<input id="undercut" type="number"></label><label>Margin %<input id="margin" type="number"></label></div>
  <label>Merchant mode<select id="merchantMode">
    <option value="off">Off</option><option value="from">From</option><option value="to">To</option><option value="both">Both</option>
  </select></label>
  <label>Outbound URL<input id="merchantToUrl" type="url"></label>
  <label>Shared token<input id="merchantToken" type="password" placeholder="stored locally"></label>
  <div class="row">
    <button id="save" type="button">Save settings</button>
    <button id="export" type="button">Export JSON</button>
    <button id="import" type="button">Import JSON</button>
    <input id="import-file" type="file" accept="application/json" hidden>
  </div>
  <p class="note">Compliance: no Google SERP scraping, CAPTCHA bypass or watermark removal. See the project docs.</p>
</body>
</html>
